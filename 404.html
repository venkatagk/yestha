<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Yestha Inc.</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f7f7fb;
        --text: rgba(6, 6, 11, 0.95);
        --muted: rgba(6, 6, 11, 0.7);
        --border: rgba(0, 0, 0, 0.12);
        --accent: #8b5cf6;
        --accent-2: #22c55e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #07070a;
          --text: #ffffff;
          --muted: rgba(255, 255, 255, 0.72);
          --border: rgba(255, 255, 255, 0.14);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        color: var(--text);
        background: radial-gradient(900px 520px at 14% 12%, rgba(139, 92, 246, 0.16), transparent 60%),
          radial-gradient(920px 640px at 86% 0%, rgba(34, 197, 94, 0.12), transparent 58%),
          radial-gradient(760px 560px at 50% 110%, rgba(255, 255, 255, 0.85), transparent 55%), var(--bg);
      }

      .card {
        width: min(640px, 100%);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 22px;
        background: rgba(255, 255, 255, 0.7);
      }

      @media (prefers-color-scheme: dark) {
        .card {
          background: rgba(255, 255, 255, 0.06);
        }
      }

      h1 {
        margin: 0;
        letter-spacing: -0.02em;
      }

      p {
        margin: 12px 0 0;
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 18px;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 650;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Page not found</h1>
      <p>The page you’re looking for doesn’t exist. Use the link below to return to the homepage.</p>
      <a href="/">Go to homepage →</a>
    </div>
  </body>
</html>
